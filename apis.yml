aid: woox

name: WOO X

image: https://oss.woonetwork.org/static/woox/SEO_20240724.png

description: WOO X is a centralized cryptocurrency exchange offering spot, margin and perpetual futures trading. Its V3 REST API at api.woox.io
  exposes public market data (instruments, orderbook, klines, trades, funding rates) and authenticated trading, account, asset/wallet, spot-margin
  and futures endpoints, documented at developer.woox.io with a published OpenAPI definition and a documentation MCP server.

