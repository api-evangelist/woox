openapi: 3.2.0
info:
  title: Swagger Petstore - OpenAPI 3.0 Account API
  description: This is a sample Pet Store Server based on the OpenAPI 3.0 specification.
  termsOfService: http://swagger.io/terms/
  contact:
    name: API Team
    email: apiteam@swagger.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.19
servers:
- url: https://api.woox.io/
tags:
- name: Account
paths:
  /v3/account/referral/summary:
    get:
      description: Get referral information from each user you has referred
      parameters:
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
          example: abcdef123456
        description: ''
      - name: x-api-signature
        in: header
        required: true
        schema:
          type: string
          example: signaturestring
        description: ''
      - name: x-api-timestamp
        in: header
        required: true
        schema:
          type: string
          example: '1718943200000'
        description: ''
      - name: startTime
        in: query
        description: start time in unix timestamp
        required: false
        explode: true
        schema:
          type: integer
      - name: endTime
        in: query
        description: end time in unix timestamp
        required: false
        explode: true
        schema:
          type: integer
      - name: page
        in: query
        description: the page you wish to query.
        required: false
        explode: true
        schema:
          type: integer
          default: 1
      - name: size
        in: query
        description: the page size you wish to query, default = 25, 1000 at max.
        required: false
        explode: true
        schema:
          type: integer
          default: 25
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralResponse'
      security: []
      tags:
      - Account
      summary: Get account referral summary
      x-summary-source: derived
      operationId: getV3AccountReferralSummary
      x-operation-id-source: derived
  /v3/account/referral/rewardHistory:
    get:
      description: Get referral information from each user you has referred.
      parameters:
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
          example: abcdef123456
        description: ''
      - name: x-api-signature
        in: header
        required: true
        schema:
          type: string
          example: signaturestring
        description: ''
      - name: x-api-timestamp
        in: header
        required: true
        schema:
          type: string
          example: '1718943200000'
        description: ''
      - name: startTime
        in: query
        description: start time in unix timestamp
        required: false
        explode: true
        schema:
          type: integer
      - name: endTime
        in: query
        description: end time in unix timestamp
        required: false
        explode: true
        schema:
          type: integer
      - name: page
        in: query
        description: the page you wish to query.
        required: false
        explode: true
        schema:
          type: integer
          default: 1
      - name: size
        in: query
        description: the page size you wish to query, default = 25, 1000 at max.
        required: false
        explode: true
        schema:
          type: integer
          default: 25
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralResponse'
      security: []
      tags:
      - Account
      summary: Get account referral reward history
      x-summary-source: derived
      operationId: getV3AccountReferralRewardHistory
      x-operation-id-source: derived
  /v3/account/tokenConfig:
    get:
      description: Get the token level configurations.
      parameters:
      - $ref: '#/components/parameters/ApiKeyHeader'
      - $ref: '#/components/parameters/SignatureHeader'
      - $ref: '#/components/parameters/TimestampHeader'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenConfigResponse'
      security: []
      tags:
      - Account
      summary: Get account token config
      x-summary-source: derived
      operationId: getV3AccountTokenConfig
      x-operation-id-source: derived
  /v3/account/symbolConfig:
    get:
      description: Get the symbol level configurations.
      parameters:
      - $ref: '#/components/parameters/ApiKeyHeader'
      - $ref: '#/components/parameters/SignatureHeader'
      - $ref: '#/components/parameters/TimestampHeader'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymbolConfigResponse'
      security: []
      tags:
      - Account
      summary: Get account symbol config
      x-summary-source: derived
      operationId: getV3AccountSymbolConfig
      x-operation-id-source: derived
  /v3/account/info:
    get:
      description: Get the account information.
      parameters:
      - $ref: '#/components/parameters/ApiKeyHeader'
      - $ref: '#/components/parameters/SignatureHeader'
      - $ref: '#/components/parameters/TimestampHeader'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfoResponse'
      security: []
      tags:
      - Account
      summary: Get account info
      x-summary-source: derived
      operationId: getV3AccountInfo
      x-operation-id-source: derived
  /v3/account/tradingMode:
    post:
      description: Set account trading mode
      parameters:
      - $ref: '#/components/parameters/ApiKeyHeader'
      - $ref: '#/components/parameters/SignatureHeader'
      - $ref: '#/components/parameters/TimestampHeader'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTradingMode'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
      security: []
      tags:
      - Account
      summary: Create account trading mode
      x-summary-source: derived
      operationId: postV3AccountTradingMode
      x-operation-id-source: derived
  /v3/account/credentials:
    get:
      description: Get account api key permission
      parameters:
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
          example: abcdef123456
        description: ''
      - name: x-api-signature
        in: header
        required: true
        schema:
          type: string
          example: signaturestring
        description: ''
      - name: x-api-timestamp
        in: header
        required: true
        schema:
          type: string
          example: '1718943200000'
        description: ''
      - name: page
        in: query
        description: the page you wish to query.
        required: false
        explode: true
        schema:
          type: integer
          default: 1
      - name: size
        in: query
        description: the page size you wish to query, default = 25, 1000 at max.
        required: false
        explode: true
        schema:
          type: integer
          default: 25
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialsResponse'
      security: []
      tags:
      - Account
      summary: Get account credentials
      x-summary-source: derived
      operationId: getV3AccountCredentials
      x-operation-id-source: derived
  /v3/account/subAccounts/all:
    get:
      description: Get account api key permission
      parameters:
      - $ref: '#/components/parameters/ApiKeyHeader'
      - $ref: '#/components/parameters/SignatureHeader'
      - $ref: '#/components/parameters/TimestampHeader'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubAccountsResponse'
      security: []
      tags:
      - Account
      summary: Get account sub accounts all
      x-summary-source: derived
      operationId: getV3AccountSubAccountsAll
      x-operation-id-source: derived
  /v3/account/listenKey:
    post:
      description: get account listen key
      parameters:
      - $ref: '#/components/parameters/ApiKeyHeader'
      - $ref: '#/components/parameters/SignatureHeader'
      - $ref: '#/components/parameters/TimestampHeader'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetListenKey'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListenKeyResponse'
      security: []
      tags:
      - Account
      summary: Create account listen key
      x-summary-source: derived
      operationId: postV3AccountListenKey
      x-operation-id-source: derived
components:
  schemas:
    Meta:
      type: object
      properties:
        total:
          type: integer
          description: Total number of record
        recordsPerPage:
          type: integer
          description: Number of records per page
        currentPage:
          type: integer
          description: Current page number
    CredentialsResponse:
      allOf:
      - $ref: '#/components/schemas/CommonResponse'
      - type: object
        properties:
          data:
            type: object
            properties:
              rows:
                type: array
                items:
                  type: object
                  properties:
                    accountName:
                      type: string
                      description: The account name associated with the API key, e.g., 'Main'.
                    userId:
                      type: integer
                      description: The unique identifier of the user associated with the API key.
                    apiKey:
                      type: string
                      description: The API key used for authentication.
                    permissions:
                      type: array
                      items:
                        type: string
                        enum:
                        - READ
                        - TRADE
                        - WITHDRAWAL
                      description: The permissions assigned to the API key, e.g., 'READ', 'TRADE', 'WITHDRAWAL'.
                    allowedIPs:
                      type: array
                      items:
                        type: string
                        format: ipv4
                      description: A list of IP addresses allowed to use this API key. This field may be hidden if there is no IP restriction.
              meta:
                $ref: '#/components/schemas/Meta'
    TokenConfigResponse:
      allOf:
      - $ref: '#/components/schemas/CommonResponse'
      - type: object
        properties:
          data:
            type: object
            properties:
              rows:
                type: array
                items:
                  type: object
                  properties:
                    token:
                      type: string
                      description: Token symbol, e.g., BTC.
                    collateralRatio:
                      type: string
                      description: The collateral ratio of the token, represented as a string.
                    marginFactor:
                      type: string
                      description: The margin factor of the token, represented as a string for precision.
                    collateral:
                      type: boolean
                      description: Indicates if the token is currently being used as collateral.
                    canCollateral:
                      type: boolean
                      description: Indicates if the token can be used as collateral.
                    canShort:
                      type: boolean
                      description: Indicates if short selling is supported for the token.
                    marginMaxLeverage:
                      type: integer
                      description: Maximum leverage allowed for margin trading.
                    marginMaxPosition:
                      type: integer
                      description: Maximum allowed position size for the token in margin trading.
    SymbolConfigResponse:
      allOf:
      - $ref: '#/components/schemas/CommonResponse'
      - type: object
        properties:
          data:
            type: object
            properties:
              rows:
                type: array
                items:
                  type: object
                  properties:
                    symbol:
                      type: string
                      description: Trading pair symbol, e.g., PERP_BTC_USDT.
                    marginFactor:
                      type: string
                      description: Margin factor for the trading pair, represented as a string for precision.
                    maxLeverage:
                      type: integer
                      description: Maximum leverage allowed for this trading pair.
                    maxPosition:
                      type: integer
                      description: Maximum position size allowed for this trading pair.
    SetTradingMode:
      required:
      - tradingMode
      type: object
      properties:
        tradingMode:
          type: string
          description: PURE_SPOT/MARGIN/FUTURES
          example: PURE_SPOT
    GetListenKey:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: WEBSOCKET
          example: WEBSOCKET
    AccountInfoResponse:
      allOf:
      - $ref: '#/components/schemas/CommonResponse'
      - type: object
        properties:
          data:
            type: object
            properties:
              applicationId:
                type: string
                description: The ID of the application associated with the account.
              account:
                type: string
                description: The account identifier.
              alias:
                type: string
                description: Alias name for the account.
              otpauth:
                type: boolean
                description: Indicates whether OTP authentication is enabled for the account.
              accountMode:
                type: string
                description: The account mode, e.g., 'MARGIN'.
                enum:
                - MARGIN
                - SPOT
              positionMode:
                type: string
                description: Position mode of the account, e.g., 'ONE_WAY'.
                enum:
                - ONE_WAY
                - HEDGE_MODE
              leverage:
                type: integer
                description: The leverage level set for the account.
              marginRatio:
                type: string
                description: The margin ratio of the account.
              openMarginRatio:
                type: string
                description: The open margin ratio of the account.
              initialMarginRatio:
                type: string
                description: The initial margin ratio of the account.
              maintenanceMarginRatio:
                type: string
                description: The maintenance margin ratio of the account.
              totalCollateral:
                type: string
                description: The total collateral value of the account.
              freeCollateral:
                type: string
                description: The free collateral value of the account.
              totalAccountValue:
                type: string
                description: The total account value.
              totalTradingValue:
                type: string
                description: The total trading value of the account.
              totalVaultValue:
                type: string
                description: The total vault value of the account.
              totalStakingValue:
                type: string
                description: The total staking value of the account.
              totalEarnValue:
                type: string
                description: The total value earned by the account.
              totalLaunchpadValue:
                type: string
                description: The total launchpad value of the account.
              referrerID:
                type: string
                description: The ID of the referrer associated with the account.
              accountType:
                type: string
                description: The type of the account, e.g., 'Main'.
                enum:
                - Main
                - Sub
    ReferralResponse:
      allOf:
      - $ref: '#/components/schemas/CommonResponse'
      - type: object
        properties:
          data:
            type: object
            properties:
              rows:
                type: array
                items:
                  type: object
                  properties:
                    referralId:
                      type: integer
                      description: Referral ID
                    registerTime:
                      type: string
                      description: Time the referral was registered
                    referralCode:
                      type: string
                      description: Referral code
                    tradeStatus:
                      type: string
                      description: Status of the trade
                    earned:
                      type: array
                      items:
                        type: object
                        properties:
                          token:
                            type: string
                            description: Token type
                          amount:
                            type: string
                            description: Amount earned
                    extraBonus:
                      type: array
                      items:
                        type: object
                        properties:
                          token:
                            type: string
                            description: Token type
                          amount:
                            type: string
                            description: Amount earned
                    previousCommission:
                      type: array
                      items:
                        type: object
                        properties:
                          token:
                            type: string
                            description: Token type
                          totalAmount:
                            type: string
                            description: Amount earned
                    email:
                      type: string
                      description: Email address
              meta:
                $ref: '#/components/schemas/Meta'
    ListenKeyResponse:
      allOf:
      - $ref: '#/components/schemas/CommonResponse'
      - type: object
        properties:
          data:
            type: object
            properties:
              authKey:
                type: string
                description: listenKey
              expiredTime:
                type: integer
                description: ''
    SubAccountsResponse:
      allOf:
      - $ref: '#/components/schemas/CommonResponse'
      - type: object
        properties:
          data:
            type: object
            properties:
              rows:
                type: array
                items:
                  type: object
                  properties:
                    applicationId:
                      type: string
                      description: The unique identifier for the application.
                    name:
                      type: string
                      description: The name of the application or sub-account.
                    createdTime:
                      type: string
                      description: The time the application was created, represented as a Unix timestamp in seconds with millisecond precision.
    CommonResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 'true'
        timestamp:
          type: integer
          description: timestamp
  parameters:
    SignatureHeader:
      name: x-api-signature
      in: header
      required: true
      schema:
        type: string
        example: signaturestring
      description: api-signature
    ApiKeyHeader:
      name: x-api-key
      in: header
      required: true
      schema:
        type: string
        example: abcdef123456
      description: api-key
    TimestampHeader:
      name: x-api-timestamp
      in: header
      required: true
      schema:
        type: string
        example: '1718943200000'
      description: api-timestamp
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    api_key:
      type: apiKey
      name: api_keyqq
      in: header
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    ApiSignAuth:
      type: apiKey
      in: header
      name: x-api-signature
    ApiTimestampAuth:
      type: apiKey
      in: header
      name: x-api-timestamp
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
