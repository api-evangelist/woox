                type: string
                description: ''
              quantity:
                type: string
                description: ''
              amount:
                type: string
                description: ''
              clientOrderId:
                type: integer
                description: ''
              bidAskLevel:
                type: integer
                description: ''
    GetTransactionsRowResponse:
      type: object
