                triggerPrice:
                  type: string
                  description: Trigger price
                triggerPriceType:
                  type: string
                  description: Trigger price type, currently only support MARKET_PRICE (i.e. last price)
                type:
                  type: string
                  description: Order type of the trigger order, LIMIT/MARKET
                price:
