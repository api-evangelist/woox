openapi: 3.2.0
info:
  title: Swagger Petstore - OpenAPI 3.0 Trade API
  description: This is a sample Pet Store Server based on the OpenAPI 3.0 specification.
  termsOfService: http://swagger.io/terms/
  contact:
    name: API Team
    email: apiteam@swagger.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.19
servers:
- url: https://api.woox.io/
tags:
- name: Trade
paths:
  /v3/trade/order:
    get:
      description: get order
      parameters:
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
          example: abcdef123456
        description: ''
      - name: x-api-signature
        in: header
        required: true
        schema:
          type: string
          example: signaturestring
        description: ''
      - name: x-api-timestamp
        in: header
        required: true
        schema:
          type: string
          example: '1718943200000'
        description: ''
      - name: orderId
        in: query
        description: Id of the order; Either orderId or clientOrderId is required. If both are passed, orderId will be used.
        required: false
        explode: true
        schema:
          type: integer
          default: 1
      - name: clientOrderId
        in: query
        description: Client order Id as assigned by the user; Either orderId or clientOrderId is required. If both are passed, orderId will be used.
        required: false
        explode: true
        schema:
          type: integer
          default: 1
      - name: withRealizedPnl
        in: query
        description: Whether to return order’s realized pnl; Note that realized PnL is only calculated for Perpetual close orders.
        required: false
        explode: true
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderResponse'
      security: []
      tags:
      - Trade
      summary: Get trade order
      x-summary-source: derived
      operationId: getV3TradeOrder
      x-operation-id-source: derived
    post:
      description: post order
      parameters:
      - $ref: '#/components/parameters/ApiKeyHeader'
      - $ref: '#/components/parameters/SignatureHeader'
      - $ref: '#/components/parameters/TimestampHeader'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
      security: []
      tags:
      - Trade
      summary: Create trade order
      x-summary-source: derived
      operationId: postV3TradeOrder
      x-operation-id-source: derived
    put:
      description: edit order
      parameters:
      - $ref: '#/components/parameters/ApiKeyHeader'
      - $ref: '#/components/parameters/SignatureHeader'
      - $ref: '#/components/parameters/TimestampHeader'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditOrder'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditOrderResponse'
      security: []
      tags:
      - Trade
      summary: Replace trade order
      x-summary-source: derived
      operationId: putV3TradeOrder
      x-operation-id-source: derived
    delete:
      description: cancel order
      parameters:
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
          example: abcdef123456
        description: ''
      - name: x-api-signature
        in: header
        required: true
        schema:
          type: string
          example: signaturestring
        description: ''
      - name: x-api-timestamp
        in: header
        required: true
        schema:
          type: string
          example: '1718943200000'
        description: ''
      - name: symbol
        in: query
        description: Symbol name
        required: true
        explode: true
        schema:
          type: string
          default: SPOT_BTC_USDT
      - name: orderId
        in: query
        description: Id of the order; Either orderId or clientOrderId is required. If both are passed, orderId will be used.
        required: false
        explode: true
        schema:
          type: integer
          default: 1
      - name: clientOrderId
        in: query
        description: Client order Id as assigned by the user; Either orderId or clientOrderId is required. If both are passed, orderId will be used.
        required: false
        explode: true
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
      security: []
      tags:
      - Trade
      summary: Delete trade order
      x-summary-source: derived
      operationId: deleteV3TradeOrder
      x-operation-id-source: derived
  /v3/trade/orders:
    get:
      description: get orders
      parameters:
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
          example: abcdef123456
        description: ''
      - name: x-api-signature
        in: header
        required: true
        schema:
          type: string
          example: signaturestring
        description: ''
      - name: x-api-timestamp
        in: header
        required: true
        schema:
          type: string
          example: '1718943200000'
        description: ''
      - name: symbol
        in: query
        description: Symbol name
        required: false
        explode: true
        schema:
          type: string
      - name: side
        in: query
        description: BUY/SELL
        required: false
        explode: true
        schema:
          type: string
      - name: positionSide
        in: query
        description: BOTH for one way mode; LONG or SHORT for hedge mode; Only applicable to perpetual instruments
        required: false
        explode: true
        schema:
          type: string
      - name: type
        in: query
        description: LIMIT/MARKET/IOC/FOK/POST_ONLY/LIQUIDATE/RPI/LIQUIDATE_BLP/ADL
        required: false
        explode: true
        schema:
          type: string
      - name: orderTag
        in: query
        description: Order tag
        required: false
        explode: true
        schema:
          type: string
      - name: withRealizedPnl
        in: query
        description: Whether to return order’s realized pnl; Note that realized PnL is only calculated for Perpetual close orders.
        required: false
        explode: true
        schema:
          type: boolean
      - name: status
        in: query
        description: NEW/CANCELLED/PARTIAL_FILLED/FILLED/REJECTED/INCOMPLETE/COMPLETED
        required: false
        explode: true
        schema:
          type: string
      - name: startTime
        in: query
        description: Start timestamp in Unix timestamp format in milliseconds
        required: false
        explode: true
        schema:
          type: integer
          format: int64
      - name: endTime
        in: query
        description: End timestamp in Unix timestamp format in milliseconds
        required: false
        explode: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        description: Page number
        required: false
        explode: true
        schema:
          type: integer
          default: 1
      - name: size
        in: query
        description: Data size per page, max 500
        required: false
        explode: true
        schema:
          type: integer
          default: 50
          maximum: 500
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrdersResponse'
      security: []
      tags:
      - Trade
      summary: Get trade orders
      x-summary-source: derived
      operationId: getV3TradeOrders
      x-operation-id-source: derived
    delete:
      description: Cancel multiple orders
      parameters:
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
          example: abcdef123456
        description: ''
      - name: x-api-signature
        in: header
        required: true
        schema:
          type: string
          example: signaturestring
        description: ''
      - name: x-api-timestamp
        in: header
        required: true
        schema:
          type: string
          example: '1718943200000'
        description: ''
      - name: symbol
        in: query
        description: Symbol name
        required: false
        explode: true
        schema:
          type: string
          default: SPOT_BTC_USDT
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
      security: []
      tags:
      - Trade
      summary: Delete trade orders
      x-summary-source: derived
      operationId: deleteV3TradeOrders
      x-operation-id-source: derived
